<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EquityFlow — Blockchain-Driven Stakeholder & Labour Tracking dApp on Ethereum Sepolia" />
    <title>EquityFlow — Paydaş & Emek Takip dApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Dark mode: sync class before React renders to prevent flash -->
    <script>
      (function () {
        var saved = localStorage.getItem("equityflow_darkmode");
        var dark = saved === null ? true : saved === "true";
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
